<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>copas ⤓ raízes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="image-feed">
      <div class="image-slide slide-img-01">
        <video class="background-video" autoplay muted loop>
          <source src="./images/intro.webm" type="video/webm" />
        </video>
        <div class="centered-arrow">⇟</div>
      </div>

      <div class="image-slide slide-img-02">
        <video class="background-video" autoplay muted loop>
          <source src="./images/intro_flip.webm" type="video/webm" />
        </video>
        <div class="centered-arrow">⇟</div>
      </div>

      <div class="image-slide slide-img-03"></div>
      <div class="image-slide slide-img-04"></div>
      <div class="image-slide slide-img-05"></div>
      <div class="image-slide slide-img-06"></div>
      <div class="image-slide slide-img-07"></div>
      <div class="image-slide slide-img-08"></div>
      <div class="image-slide slide-img-09">
        <video class="background-video" autoplay muted loop>
          <source src="./images/tree_house.webm" type="video/webm" />
        </video>
      </div>
      <div class="image-slide slide-img-10">
        <div class="centered-arrow">⇟</div>
      </div>
      <div class="image-slide slide-img-11"></div>
      <div class="image-slide slide-img-12"></div>
      <div class="image-slide slide-img-13"></div>
      <div class="image-slide slide-img-14">
        <div class="slide-content">
          <button class="button-next" id="btn">progredir ☛</button>
        </div>
      </div>
    </section>

    <script src="scripts.js"></script>
  </body>
</html>

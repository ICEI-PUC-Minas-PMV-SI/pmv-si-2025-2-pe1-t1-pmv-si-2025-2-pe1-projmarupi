<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>copas ⤓ raízes</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mozilla+Text:wght@200..700&family=Rubik+80s+Fade&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="image-feed">
      <div class="image-slide slide-img-01">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/intro2_flip.webm" type="video/webm" />
        </video>
        <div class="centered-arrow">⇟</div>
      </div>

      <div class="image-slide slide-img-02">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/intro2.webm" type="video/webm" />
        </video>
        <div class="centered-arrow">⇟</div>
      </div>

      <div class="image-slide slide-img-03">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/soft_parallax.webm" type="video/webm" />
        </video>
      </div>
      <div class="image-slide slide-img-04">
        <video class="background-video" autoplay muted loop>
          <source
            src="./videos/soft_parallax_inverted.webm"
            type="video/webm"
          />
        </video>
      </div>
      <div class="image-slide slide-img-05">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/soft_parallax_2.webm" type="video/webm" />
        </video>
      </div>
      <div class="image-slide slide-img-06">
        <video class="background-video" autoplay muted loop>
          <source
            src="./videos/soft_parallax_2_inverted.webm"
            type="video/webm"
          />
        </video>
      </div>
      <div class="image-slide slide-img-07"></div>
      <div class="image-slide slide-img-08"></div>
      <div class="image-slide slide-img-09">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/tree_house.webm" type="video/webm" />
        </video>
      </div>
      <div class="image-slide slide-img-10">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/wind_tree_parallax.webm" type="video/webm" />
        </video>
        <div class="slide-text-10">I A A</div>
        <div class="centered-arrow">⇟</div>
      </div>

      <div class="image-slide slide-img-11">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/wind_trees_cloud_flip.webm" type="video/webm" />
        </video>

        <div class="slide-text-11">
          inventário arqueológico<br />arbóreo de belo horizonte
        </div>
        <div class="centered-arrow2">⇟</div>
      </div>
      <div class="image-slide slide-img-13">
        <video class="background-video" autoplay muted loop>
          <source src="./videos/last_parallax.webm" type="video/webm" />
        </video>
      </div>
      <div class="image-slide slide-img-14">
        <video class="background-video" autoplay muted loop>
          <source
            src="./videos/last_parallax_inverted.webm"
            type="video/webm"
          />
        </video>
        <div class="slide-content">
          <button class="button-next" id="btn">progredir ☛</button>
        </div>
      </div>
    </section>

    <script src="scripts.js"></script>
  </body>
</html>

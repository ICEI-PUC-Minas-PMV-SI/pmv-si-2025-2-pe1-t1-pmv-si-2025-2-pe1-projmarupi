<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avaliação facultativa</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>&lt;avaliação_facultativa/&gt;</h1>
    </header>

    <img
      class="ameba"
      src="images/blob_top.png"
      alt="grafismo em forma de ameba do background"
    />
    <main class="main-content">
      <img
        class="center-graphic"
        src="images/grafismo_central_alpha.png"
        alt="Grafismo central do background"
      />

      <img
        class="blob-down-right"
        src="images/blob_down.png"
        alt="Grafismo decorativo inferior direito"
      />
      <div class="card-container">
        <div class="card">
          <div class="card-row-1">
            <p>Existem mais estrelas ou árvores na Via Láctea?</p>
          </div>
          <div class="card-row-2">
            <div class="nested-row">Estrelas</div>
            <div class="nested-row correct-answer">Árvores</div>
            <div class="nested-row">Empate técnico</div>
          </div>
        </div>

        <div class="card">
          <div class="card-row-1">
            <p>
              Quanto tempo levaríamos para desmatar e fatalmente “igualar”
              estrelas e árvores?
            </p>
          </div>
          <div class="card-row-2">
            <div class="nested-row">Aproximadamente 500 anos</div>
            <div class="nested-row correct-answer">
              Aproximadamente 5.000 anos
            </div>
            <div class="nested-row">Aproximadamente 50.0000 anos</div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="scripts.js"></script>
  </body>
</html>

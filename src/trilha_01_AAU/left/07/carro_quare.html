<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrossel Arbóreo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-text">
      <h1>&lt;quaresmeira&gt;</h1>

      <div class="carrousel-wrapper">
        <button class="carrousel-nav-btn prev-btn">☚</button>
        <div class="carrousel-container">
          <div class="carrousel-slider">
            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q01.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="1"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q02.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="2"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q03.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="3"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q04.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="4"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q05.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="5"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q06.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="6"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q07.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="7"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q08.jpg"
                alt="Fotografia de QUaresmeira"
                data-index="8"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q09.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="9"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/quaresmeira/q10.jpg"
                alt="Fotografia de Quaresmeira"
                data-index="10"
              />
            </div>
          </div>
        </div>
        <button class="carrousel-nav-btn next-btn">☛</button>
      </div>

      <button class="escape-btn" id="escape-btn">☛</button>
      <button class="btn-move-on" id="move-on-btn">☚ Atividade 2</button>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>

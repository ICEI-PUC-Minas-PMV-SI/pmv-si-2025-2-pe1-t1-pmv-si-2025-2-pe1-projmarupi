<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrossel Arbóreo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-text">
      <h1>&lt;acácia-amarela&gt;</h1>

      <div class="carrousel-wrapper">
        <button class="carrousel-nav-btn prev-btn">☚</button>
        <div class="carrousel-container">

            <div class="carrousel-image">
              <img
                src="images/acacia/a01.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="1"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/acacia/a02.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="2"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/acacia/a03.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="3"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/acacia/a04.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="4"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/acacia/a05.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="5"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/acacia/a06.jpg"

                data-index="6"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/acacia/a07.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="7"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/acacia/a08.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="8"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/acacia/a09.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="9"
              />
            </div>

            <div class="carrousel-image">
              <img
                src="images/acacia/a10.jpg"
                alt="Fotografia de Acácia-Amarela"
                data-index="10"
              />
            </div>

            <div class="carrousel-image">

              />
            </div>
          </div>
        </div>
        <button class="carrousel-nav-btn next-btn">☛</button>
      </div>

      <button class="escape-btn" id="escape-btn">☛</button>
      <button class="btn-move-on" id="move-on-btn">☚ AVANÇAR</button>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrossel Arbóreo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-text">
      <h1>&lt;ipê-amarelo&gt;</h1>

      <div class="carrousel-wrapper">
        <button class="carrousel-nav-btn prev-btn">☚</button>
        <div class="carrousel-container">
          <div class="carrousel-slider">
            <div class="carrousel-image">
              <img
                src="images/ipe/i01.jpg"
                alt="Fotografia de ipê-amarelo"
                data-index="1"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/ipe/i02.jpg"
                alt="Fotografia de ipê-amarelo"
                data-index="2"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/ipe/i03.jpg"
                alt="Fotografia de ipê-amarelo"
                data-index="3"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/ipe/i04.jpg"
                alt="Fotografia de ipê-amarelo"
                data-index="4"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/ipe/i05.jpg"
                alt="Fotografia de ipê-amarelo"
                data-index="5"
              />
            </div>
          </div>
        </div>
        <button class="carrousel-nav-btn next-btn">☛</button>
      </div>

      <button class="escape-btn" id="escape-btn">☛</button>
      <button class="escape-btn" id="move-on-btn">☚</button>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>

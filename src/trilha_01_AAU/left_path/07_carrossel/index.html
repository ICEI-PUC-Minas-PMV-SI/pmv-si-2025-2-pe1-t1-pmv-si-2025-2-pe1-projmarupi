<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrossel Arbóreo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-text">
      <h1>&lt;sibipiruna&gt;</h1>

      <div class="carrousel-wrapper">
        <button class="carrousel-nav-btn prev-btn">☚</button>
        <div class="carrousel-container">
          <div class="carrousel-slider">
            <div class="carrousel-image">
              <img
                src="images/sibipiruna/s01.jpg"
                alt="Sibipiruna 1"
                data-index="1"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/sibipiruna/s02.jpg"
                alt="Sibipiruna 2"
                data-index="2"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/sibipiruna/s03.jpg"
                alt="Sibipiruna 3"
                data-index="3"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/sibipiruna/s04.jpg"
                alt="Sibipiruna 4"
                data-index="4"
              />
            </div>
            <div class="carrousel-image">
              <img
                src="images/sibipiruna/s05.jpg"
                alt="Sibipiruna 5"
                data-index="5"
              />
            </div>
          </div>
        </div>
        <button class="carrousel-nav-btn next-btn">☛</button>
      </div>

      <button class="escape-btn">☛</button>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>

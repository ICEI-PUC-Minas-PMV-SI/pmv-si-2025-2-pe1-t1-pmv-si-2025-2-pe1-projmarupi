<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sussurros de Sampa</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico" />
    <link rel="stylesheet" href="../menu/menu.css" />

    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Mozilla+Text:wght@200..700&family=Rubik+80s+Fade&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1 class="title">Sussurros de Sampa</h1>
      <p class="subtitle">Trilhas de Lendas Urbanas</p>
    </header>

    <main class="card">
      <div class="card-header">
        <h2 class="card-title">O Edifício Martinelli</h2>
        <span class="step-number">01/05</span>
      </div>

      <div class="card-image-container">
        <img
          src="./images/Edificio-Martinelli_170810_Foto_JoseCordeiro_014-42.jpg"
          alt="Edifício Martinelli"
        />
      </div>

      <div class="card-content">
        <p class="card-description">
          Foi o primeiro arranha-céu de São Paulo e palco de histórias de
          luxo... e horror.
        </p>

        <div class="card-actions">
          <button class="btn" id="btnBack">Voltar</button>
          <button class="btn btn-primary" id="btnNext">Avançar</button>
        </div>
      </div>
    </main>
    <script src="../menu/menu.js"></script>
    <script src="script.js"></script>
  </body>
</html>
